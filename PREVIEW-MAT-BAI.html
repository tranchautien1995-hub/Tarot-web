(--gold);font-size:9px;font-style:normal;margin-top:6px}

/* V2.2 font + Rider-Waite image overrides */
body{line-height:1.5;text-rendering:optimizeLegibility}
.brand,.top-note,.eyebrow,.panel-kicker,.mini-label,.message span{letter-spacing:.14em}
.question-card textarea,.chat-form input,.picker-tools>input,.custom-count input{font-family:var(--font-ui)}
.practice-card-face{background:#efe6d2;padding:6px}
.practice-card-inner.image-mode{padding:0;overflow:hidden;background:#f4eddf}
.practice-card-image,.library-image,.viewer-image{display:block;width:100%;height:100%;object-fit:contain;background:#f4eddf}
.practice-card-image{min-height:100%}
.practice-card-caption{padding:10px 4px 0;text-align:center}
.practice-card-caption strong{display:block;font-family:var(--font-heading);font-size:18px;line-height:1.2}
.practice-card-caption small{display:block;color:#9a8f9e;font-size:11px;margin-top:4px}
.practice-card-caption p{margin:10px 0 0;font-size:10px;line-height:1.5;color:#8b808d;text-transform:uppercase}
.card-artwork-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;background:linear-gradient(150deg,#e8decb,#c8b99f);color:#241b24;border:1px solid rgba(66,46,35,.45)}
.card-artwork-fallback span{font-size:42px;color:var(--wine);line-height:1}
.card-artwork-fallback strong{margin-top:10px;font-family:var(--font-heading);font-size:16px;line-height:1.15}
.card-artwork-fallback small{margin-top:5px;font-size:10px;color:#6d5d56}
.library-grid.image-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.library-card.image-card{padding:10px}
.library-art.image-mode{overflow:hidden;background:#f4eddf;border-radius:3px}
.library-image{aspect-ratio:2/3.1}
.library-fallback span{font-size:30px}
.viewer-image{aspect-ratio:2/3.15}
.viewer-fallback span{font-size:36px}
@media(max-width:620px){
  .practice-card-caption strong{font-size:15px}
  .library-grid.image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* =========================
   V2.3 — presets + history
   ========================= */
.compact-intro{padding-bottom:38px}
.v23-controls{grid-template-columns:.92fr 1.08fr}
.preset-panel{min-width:0}
.preset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}
.preset-grid button{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12);color:#b8afbc;padding:14px;text-align:left;min-height:78px}
.preset-grid button:hover{border-color:var(--line)}
.preset-grid button.active{border-color:var(--gold);background:rgba(98,55,87,.22);color:var(--gold2)}
.preset-grid b{display:block;font-family:var(--font-heading);font-size:17px;font-weight:600}
.preset-grid small{display:block;margin-top:5px;color:#817886;font-size:11px;line-height:1.4}
.custom-v23{margin-top:10px;width:max-content}
.celtic-grid{grid-template-columns:repeat(5,minmax(145px,1fr))}
.history-section{margin-top:52px}
.history-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}
.history-head h2{font-family:var(--font-heading);font-weight:600;font-size:34px;margin:8px 0 0}
.history-head p{margin:8px 0 0;color:#918695;font-size:13px;line-height:1.55}
.history-empty{border:1px dashed rgba(213,179,109,.28);background:rgba(213,179,109,.02);padding:24px;color:#8f8593;font-size:13px}
.history-list{display:grid;gap:12px}
.history-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(28,22,35,.88),rgba(16,13,21,.9));padding:18px 20px}
.history-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.history-card-top span{color:#83798a;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.history-card-top h3{font-family:var(--font-heading);font-size:21px;font-weight:600;margin:6px 0 0;line-height:1.25}
.history-actions{display:flex;gap:6px;flex-shrink:0}
.history-actions button{border:1px solid rgba(255,255,255,.08);background:transparent;color:#b8adb9;padding:8px 11px;font-size:10px}
.history-actions button:hover{border-color:var(--gold);color:var(--gold2)}
.history-actions .danger-link{color:#b9838e}
.history-cards-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.history-cards-line span{border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.14);padding:6px 8px;color:#a89eaa;font-size:10px}
.history-reading-preview{margin:14px 0 0;border-top:1px solid rgba(255,255,255,.05);padding-top:13px;color:#a99fac;font-size:12px;line-height:1.65}
@media(max-width:1000px){.celtic-grid{grid-template-columns:repeat(3,minmax(145px,1fr))}}
@media(max-width:850px){.v23-controls{grid-template-columns:1fr}.history-head{align-items:flex-start;flex-direction:column}.celtic-grid{grid-template-columns:repeat(2,minmax(145px,1fr))}}
@media(max-width:620px){.preset-grid{grid-template-columns:1fr 1fr}.history-card-top{flex-direction:column}.history-actions{width:100%}.history-actions button{flex:1}.celtic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* =========================
   V2.4 — interactive shuffle + draw
   ========================= */
.interactive-draw{margin-top:26px;padding:0;overflow:hidden;background:linear-gradient(180deg,rgba(21,17,28,.98),rgba(11,9,16,.99))}
.interactive-draw-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:22px 24px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.interactive-draw-head h2{font-family:var(--font-heading);font-size:32px;font-weight:600;margin:7px 0 0}
.interactive-draw-head p{margin:8px 0 0;color:#9f95a2;font-size:13px;line-height:1.55}
.draw-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.draw-table{position:relative;min-height:590px;overflow:hidden;background:radial-gradient(circle at 50% 22%,rgba(213,179,109,.06),transparent 25%),linear-gradient(180deg,#100d16,#09070c)}
.draw-table::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 1px,transparent 1.2px),radial-gradient(circle at 79% 23%,rgba(213,179,109,.55) 0 1px,transparent 1.2px);background-size:190px 190px,270px 270px;opacity:.2}
.picked-slots{position:relative;z-index:120;display:grid;grid-template-columns:repeat(3,minmax(92px,145px));gap:12px;justify-content:center;padding:34px 24px 10px;min-height:180px}
.picked-slots.count-6{grid-template-columns:repeat(6,minmax(76px,112px))}
.picked-slots.count-many{grid-template-columns:repeat(5,minmax(74px,105px));max-width:650px;margin:auto}
.picked-slot{aspect-ratio:2/3.12;border:1px solid rgba(213,179,109,.24);background:rgba(255,255,255,.018);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:#716875;position:relative;border-radius:6px;transition:border-color .25s ease,background .25s ease}
.picked-slot>span{position:absolute;top:8px;left:9px;font-size:9px;letter-spacing:.12em;color:#8a7e8d}
.picked-slot small{font-size:9px;line-height:1.3;color:#736a77}
.picked-slot.filled{border-color:rgba(213,179,109,.5);background:rgba(213,179,109,.045)}
.mini-card-back,.shuffle-card,.fan-card{border:1px solid rgba(231,211,163,.54);background:linear-gradient(145deg,#252621,#121510 62%,#090b08);box-shadow:0 12px 30px rgba(0,0,0,.34),inset 0 0 0 4px #151a13,inset 0 0 0 5px rgba(213,179,109,.16);color:#dfc47f}
.mini-card-back::before,.shuffle-card::before,.fan-card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(213,179,109,.26);background:radial-gradient(circle at center,transparent 0 10px,rgba(213,179,109,.06) 11px 12px,transparent 13px),linear-gradient(45deg,transparent 48%,rgba(213,179,109,.11) 49% 51%,transparent 52%),linear-gradient(-45deg,transparent 48%,rgba(213,179,109,.11) 49% 51%,transparent 52%)}
.mini-card-back span,.fan-card span{position:relative;z-index:2;font-size:20px;text-shadow:0 0 12px rgba(213,179,109,.35)}
.picked-card-back{position:absolute;inset:7px;border-radius:5px;display:flex;align-items:center;justify-content:center;animation:pickedArrive .42s cubic-bezier(.2,.75,.2,1.08) both}
@keyframes pickedArrive{0%{opacity:0;transform:translateY(70px) scale(.76) rotate(5deg)}100%{opacity:1;transform:none}}
.shuffle-zone{position:absolute;left:50%;top:57%;width:190px;height:255px;transform:translate(-50%,-50%);z-index:30}
.shuffle-card{position:absolute;left:50%;top:50%;width:112px;height:176px;border-radius:7px;transform:translate(-50%,-50%) rotate(calc((var(--shuffle-index) - 7) * .32deg));transition:transform .35s ease}
.shuffle-back-mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;z-index:2}
.shuffle-caption{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:10px;letter-spacing:.22em;color:#776e79;white-space:nowrap}
.is-shuffling .shuffle-card.left-packet{animation:shuffleLeft 1.02s ease-in-out calc((var(--shuffle-index) % 4) * 90ms) 2 alternate}
.is-shuffling .shuffle-card.right-packet{animation:shuffleRight 1.02s ease-in-out calc((var(--shuffle-index) % 4) * 90ms) 2 alternate}
@keyframes shuffleLeft{0%{transform:translate(-50%,-50%) rotate(-2deg)}45%{transform:translate(-112%,-50%) rotate(-13deg) translateY(-8px)}70%{transform:translate(-72%,-43%) rotate(8deg)}100%{transform:translate(-50%,-50%) rotate(-1deg)}}
@keyframes shuffleRight{0%{transform:translate(-50%,-50%) rotate(2deg)}45%{transform:translate(12%,-50%) rotate(13deg) translateY(8px)}70%{transform:translate(-28%,-57%) rotate(-8deg)}100%{transform:translate(-50%,-50%) rotate(1deg)}}
.fan-zone{position:absolute;left:0;right:0;bottom:0;height:345px;z-index:20;animation:fanReveal .7s ease both}
@keyframes fanReveal{from{opacity:0;transform:translateY(75px) scale(.96)}to{opacity:1;transform:none}}
.fan-card{position:absolute;width:78px;height:123px;border-radius:5px;padding:0;display:flex;align-items:center;justify-content:center;transform-origin:50% 116%;transition:bottom .16s ease,filter .16s ease,opacity .22s ease,box-shadow .16s ease;will-change:transform,bottom}

.fan-card.flying{animation:flyCard .43s cubic-bezier(.21,.7,.22,1) forwards;z-index:200!important;pointer-events:none}
@keyframes flyCard{0%{filter:brightness(1.22)}55%{transform:translateX(-50%) translateY(-235px) rotate(0deg) scale(1.07)}100%{opacity:0;transform:translateX(-50%) translateY(-325px) rotate(0deg) scale(.78)}}
.fan-shadow{position:absolute;left:7%;right:7%;bottom:-10px;height:90px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);filter:blur(12px);pointer-events:none}
.fan-tip{margin:0;padding:13px 20px 17px;text-align:center;border-top:1px solid rgba(255,255,255,.045);color:#7f7582;font-size:11px;letter-spacing:.03em}

/* =========================
   V2.5 — riffle shuffle + drag/drop + Ethereal Visions asset slot
   ========================= */
.ethereal-card-back{
  background-color:#172019;
  background-image:
    url('/cards/ethereal-visions/back.jpg'),
    radial-gradient(circle at center,rgba(227,203,132,.22) 0 2px,transparent 3px 18px,rgba(227,203,132,.12) 19px 20px,transparent 21px),
    linear-gradient(135deg,#263328,#121914 58%,#090d0a);
  background-size:cover,auto,auto;
  background-position:center;
  background-repeat:no-repeat;
}
.v25-table{min-height:620px;touch-action:none;user-select:none}
.draggable-slots{z-index:140;position:relative}
.drop-slot{transition:border-color .16s ease,background .16s ease,box-shadow .16s ease,transform .16s ease}
.drop-slot.drop-hover:not(.drop-blocked){border-color:var(--gold2);background:rgba(213,179,109,.12);box-shadow:0 0 0 2px rgba(213,179,109,.1),0 0 28px rgba(213,179,109,.13);transform:translateY(-3px)}
.drop-slot.drop-blocked{border-color:#a35d69;background:rgba(124,47,65,.14)}
.draggable-picked{cursor:grab;touch-action:none}
.draggable-picked:active,.fan-card:active{cursor:grabbing}
.picked-card-back i{position:relative;z-index:3;font-style:normal;font-size:20px;color:#e4cb8b;text-shadow:0 0 12px rgba(213,179,109,.45)}
.slot-remove{position:absolute;right:4px;top:4px;z-index:8;width:22px;height:22px;border:1px solid rgba(255,255,255,.09);border-radius:50%;background:rgba(8,7,10,.72);color:#a99da9;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.slot-remove:hover{border-color:#b67f8c;color:#e6b3bf}

.riffle-zone{position:absolute;left:50%;top:60%;width:330px;height:285px;transform:translate(-50%,-50%);z-index:35;perspective:900px}
.riffle-card{position:absolute;left:50%;top:42%;width:112px;height:176px;border:1px solid rgba(231,211,163,.54);border-radius:7px;box-shadow:0 12px 30px rgba(0,0,0,.34),inset 0 0 0 4px rgba(15,19,15,.7),inset 0 0 0 5px rgba(213,179,109,.16);display:flex;align-items:center;justify-content:center;color:#dfc47f;transform:translate(-50%,-50%) translate(calc((var(--stack-index) - 12) * .18px),calc((var(--stack-index) - 12) * -.25px)) rotate(calc((var(--stack-index) - 12) * .055deg));transform-origin:50% 90%;will-change:transform,opacity;z-index:calc(30 - var(--stack-index))}
.riffle-card::after{content:"";position:absolute;inset:9px;border:1px solid rgba(213,179,109,.24);pointer-events:none}
.riffle-card span{position:relative;z-index:3;font-size:24px;text-shadow:0 0 12px rgba(213,179,109,.35)}
.riffle-zone.is-shuffling .packet-left{animation:v25RiffleLeft 2.85s cubic-bezier(.34,.04,.2,1) calc(var(--packet-index) * 34ms) both}
.riffle-zone.is-shuffling .packet-right{animation:v25RiffleRight 2.85s cubic-bezier(.34,.04,.2,1) calc(var(--packet-index) * 34ms) both}
@keyframes v25RiffleLeft{
  0%,8%{transform:translate(-50%,-50%) translateX(-1px) rotate(-.5deg)}
  23%{transform:translate(-118%,-49%) translateY(calc(var(--packet-index) * -.6px)) rotate(-11deg)}
  38%{transform:translate(-122%,-44%) translateY(calc(var(--packet-index) * -.8px)) rotate(-15deg)}
  55%{transform:translate(-78%,-39%) translateY(calc(var(--packet-index) * 1.1px)) rotate(-7deg)}
  67%{transform:translate(-55%,-48%) translateY(calc(var(--packet-index) * -.55px)) rotate(3deg)}
  82%{transform:translate(-50%,-50%) translateY(calc(var(--packet-index) * -.34px)) rotate(.6deg)}
  100%{transform:translate(-50%,-50%) translate(calc((var(--packet-index) - 6) * .18px),calc((var(--packet-index) - 6) * -.2px)) rotate(0deg)}
}
@keyframes v25RiffleRight{
  0%,8%{transform:translate(-50%,-50%) translateX(1px) rotate(.5deg)}
  23%{transform:translate(18%,-49%) translateY(calc(var(--packet-index) * .6px)) rotate(11deg)}
  38%{transform:translate(22%,-44%) translateY(calc(var(--packet-index) * .8px)) rotate(15deg)}
  55%{transform:translate(-22%,-39%) translateY(calc(var(--packet-index) * -1.1px)) rotate(7deg)}
  67%{transform:translate(-45%,-48%) translateY(calc(var(--packet-index) * .55px)) rotate(-3deg)}
  82%{transform:translate(-50%,-50%) translateY(calc(var(--packet-index) * -.34px)) rotate(-.6deg)}
  100%{transform:translate(-50%,-50%) translate(calc((var(--packet-index) - 6) * -.18px),calc((var(--packet-index) - 6) * -.2px)) rotate(0deg)}
}
.riffle-shadow{position:absolute;left:22%;right:22%;top:67%;height:38px;background:radial-gradient(ellipse at center,rgba(0,0,0,.62),transparent 72%);filter:blur(9px)}
.shuffle-progress-label{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;white-space:nowrap}

.drag-card-ghost{position:fixed;z-index:9999;width:84px;height:132px;transform:translate(-50%,-50%) rotate(2deg) scale(1.04);border:1px solid rgba(240,216,159,.7);border-radius:6px;box-shadow:0 24px 55px rgba(0,0,0,.58),0 0 0 1px rgba(213,179,109,.18);pointer-events:none;display:flex;align-items:center;justify-content:center;color:#e6cf94}
.drag-card-ghost span{font-size:21px;text-shadow:0 0 14px rgba(213,179,109,.45)}
.v25-tip{font-size:12px;line-height:1.55}

/* When the user provides Ethereal Visions images, the existing image components use them automatically. */

@media(max-width:920px){.riffle-zone{top:63%;transform:translate(-50%,-50%) scale(.92)}}

/* =========================
   V2.10 — Light / Dark themes + drifting star field
   ========================= */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f4ef;
  --panel:rgba(255,255,255,.78);
  --panel2:#fbf8f3;
  --ink:#302934;
  --muted:#786f7b;
  --gold:#a77c3e;
  --gold2:#765328;
  --line:rgba(112,82,52,.18);
  --wine:#815267;
  --danger:#a45c69;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0910;
  --panel:#15111c;
  --panel2:#1b1522;
  --ink:#f4eee5;
  --muted:#a69daa;
  --gold:#d5b36d;
  --gold2:#f0d89f;
  --line:rgba(213,179,109,.24);
  --wine:#65213f;
  --danger:#d48b9b;
}
html[data-theme="light"] body{background:#f6f2ec;color:var(--ink)}
html[data-theme="dark"] body{background:#09080e;color:var(--ink)}

main.theme-light{
  background:
    radial-gradient(circle at 50% -14%,rgba(223,204,245,.68) 0,rgba(247,240,250,.74) 23%,transparent 47%),
    radial-gradient(circle at 8% 35%,rgba(245,221,188,.53),transparent 31%),
    radial-gradient(circle at 94% 60%,rgba(219,229,247,.56),transparent 34%),
    linear-gradient(180deg,#fffdf9 0%,#f8f4ee 54%,#f3efe9 100%);
  color:#302934;
}
main.theme-dark{
  background:
    radial-gradient(circle at 50% -10%,#321b34 0,#121019 35%,#09080e 72%),
    linear-gradient(180deg,#0d0a12,#08070b);
  color:#f4eee5;
}

/* Soft moving star dust across the whole page. */
.star-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star-field span{
  position:absolute;
  left:var(--star-left);
  top:var(--star-top);
  width:var(--star-size);
  height:var(--star-size);
  border-radius:50%;
  opacity:.36;
  animation:starDrift var(--star-duration) ease-in-out var(--star-delay) infinite alternate;
  will-change:transform,opacity;
}
.theme-light .star-field span{background:#9c7ab1;box-shadow:0 0 5px rgba(166,125,75,.22)}

/* =========================
   V2.12 — larger cards, external position labels, richer sky, cleaner light deck
   ========================= */

/* 75 mixed stars: dots, sparkles and five-point stars. */
.star-field .star-item{
  position:absolute;
  left:var(--star-left);
  top:var(--star-top);
  width:var(--star-size);
  height:var(--star-size);
  animation:
    v212StarTravel var(--star-duration) ease-in-out var(--star-delay) infinite alternate,
    v212StarTwinkle var(--star-twinkle) ease-in-out var(--star-delay) infinite;
  will-change:transform,opacity;
}
.star-field .star-dot{
  border-radius:50%;
}
.star-field .star-sparkle,
.star-field .star-five{
  width:auto;
  height:auto;
  background:transparent!important;
  border-radius:0;
  font-size:calc(var(--star-size) * 1.5);
  line-height:1;
  display:block;
  transform-origin:center;
}
.theme-light .star-field .star-dot{background:#8d68a6;opacity:.66;box-shadow:0 0 7px rgba(119,83,143,.34)}
.theme-light .star-field .star-sparkle{color:#ad7532;opacity:.76;text-shadow:0 0 7px rgba(177,122,52,.30)}
.theme-light .star-field .star-five{color:#6d83a5;opacity:.68;text-shadow:0 0 8px rgba(79,108,146,.28)}
.theme-dark .star-field .star-dot{background:#fff4d7;opacity:.66;box-shadow:0 0 8px rgba(240,216,159,.50)}
.theme-dark .star-field .star-sparkle{color:#f0d89f;opacity:.82;text-shadow:0 0 9px rgba(240,216,159,.58)}
.theme-dark .star-field .star-five{color:#d8c5e8;opacity:.74;text-shadow:0 0 9px rgba(194,160,218,.42)}
@keyframes v212StarTravel{
  0%{transform:translate3d(0,5px,0) rotate(-7deg) scale(.82)}
  50%{transform:translate3d(calc(var(--star-drift-x) * .48),calc(var(--star-drift-y) * .48),0) rotate(6deg) scale(1.08)}
  100%{transform:translate3d(var(--star-drift-x),var(--star-drift-y),0) rotate(15deg) scale(1.22)}
}
@keyframes v212StarTwinkle{
  0%,100%{opacity:.34;filter:brightness(.9)}
  45%{opacity:1;filter:brightness(1.28)}
  65%{opacity:.58;filter:brightness(1.06)}
}

/* Shooting stars cross in both directions. */
.shooting-star-field{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.shooting-star{
  position:absolute;
  top:var(--shoot-top);
  width:150px;
  height:2px;
  border-radius:999px;
  opacity:0;
  will-change:transform,opacity;
}
.shooting-star::before{
  content:"";
  position:absolute;
  right:-2px;
  top:50%;
  width:6px;
  height:6px;
  border-radius:50%;
  transform:translateY(-50%);
  box-shadow:0 0 11px currentColor;
  background:currentColor;
}
.theme-light .shooting-star{color:#a37a43;background:linear-gradient(90deg,transparent,rgba(159,117,64,.08),rgba(159,117,64,.72))}
.theme-dark .shooting-star{color:#f0d89f;background:linear-gradient(90deg,transparent,rgba(240,216,159,.08),rgba(240,216,159,.82))}
.shooting-right{left:-190px;transform:rotate(-18deg);animation:v212ShootRight var(--shoot-duration) linear var(--shoot-delay) infinite}
.shooting-left{right:-190px;transform:rotate(198deg);animation:v212ShootLeft var(--shoot-duration) linear var(--shoot-delay) infinite}
@keyframes v212ShootRight{
  0%,12%{opacity:0;translate:0 0}
  17%{opacity:.82}
  55%{opacity:.72}
  68%,100%{opacity:0;translate:calc(100vw + 380px) 180px}
}
@keyframes v212ShootLeft{
  0%,12%{opacity:0;translate:0 0}
  17%{opacity:.78}
  55%{opacity:.68}
  68%,100%{opacity:0;translate:calc(-100vw - 380px) 180px}
}

/* Labels live outside the card frame and are deliberately easier to scan. */
.spread-slot-item{min-width:0;display:flex;flex-direction:column}
.slot-position-heading{
  min-height:54px;

  align-items:flex-end;

}

.theme-light .slot-position-heading strong{color:#403642}

/* Make every working card substantially larger, including 6- and 10-card spreads. */
.v27-slots{
  gap:18px;
  padding:24px 26px 18px;
  align-items:start;
}
.v27-slots.count-3{
  grid-template-columns:repeat(3,minmax(190px,230px));
  max-width:790px;
  width:100%;
  margin-inline:auto;
}
.v27-slots.count-6{
  grid-template-columns:repeat(6,minmax(132px,158px));
  max-width:1080px;
  width:100%;
  margin-inline:auto;
}
.v27-slots.count-many{
  grid-template-columns:repeat(5,minmax(140px,164px));

/* =========================
   V2.15 — fixed 4.5cm × 7cm cards + compact one-line labels
   ========================= */
:root{
  --spread-card-width:4.5cm;
  --spread-card-height:7cm;
}

/* Every spread uses the exact same card box size. The grid wraps instead of shrinking cards. */
.v27-slots,
.v27-slots.count-1,
.v27-slots.count-2,
.v27-slots.count-3,
.v27-slots.count-4,
.v27-slots.count-5,
.v27-slots.count-6,
.v27-slots.count-many{
  display:grid;
  gap:20px 18px;
  justify-content:center;
  align-items:start;
  width:100%;
  max-width:none;
  margin-inline:auto;
  padding:22px 18px 18px;
}
.v27-slots.count-1{grid-template-columns:repeat(1,var(--spread-card-width))}
.v27-slots.count-2{grid-template-columns:repeat(2,var(--spread-card-width))}
.v27-slots.count-3{grid-template-columns:repeat(3,var(--spread-card-width))}
.v27-slots.count-4{grid-template-columns:repeat(2,var(--spread-card-width))}
.v27-slots.count-5{grid-template-columns:repeat(3,var(--spread-card-width))}
.v27-slots.count-6{grid-template-columns:repeat(3,var(--spread-card-width))}
.v27-slots.count-many{grid-template-columns:repeat(5,var(--spread-card-width))}

.spread-slot-item{
  width:var(--spread-card-width);
  min-width:var(--spread-card-width);
  max-width:var(--spread-card-width);
}
.picked-slot{
  width:var(--spread-card-width)!important;
  height:var(--spread-card-height)!important;
  min-width:var(--spread-card-width)!important;
  min-height:var(--spread-card-height)!important;
  max-width:var(--spread-card-width)!important;
  max-height:var(--spread-card-height)!important;
  aspect-ratio:auto!important;
  flex:none;
}

/* Position titles stay outside the card, compact, regular-weight and one line. */
.slot-position-heading{
  width:var(--spread-card-width);
  min-height:34px;
  height:34px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 2px 6px;
  overflow:visible;
}
.slot-position-heading>span:first-child{
  flex:none;
  font-size:9px;
  line-height:1;
  letter-spacing:.06em;
  color:var(--gold);
  font-weight:400;
}
.slot-position-name{
  display:block;
  min-width:0;
  flex:1;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  font-family:var(--font-ui);
  font-size:12px;
  line-height:1;
  font-weight:400;
  letter-spacing:0;
  color:#d7ccd9;
}
.theme-light .slot-position-name{color:#544b57}

/* Keep the 78-card status visibly below the physical deck, not underneath it. */
.v27-shuffle-label{

}

/* Lift the card packet slightly so the status and shuffle button have a clean lane below it. */
.v27-riffle-zone .riffle-card{top:36%}
.v27-inline-shuffle{bottom:-17px}

/* Preserve exact card size through common desktop widths by wrapping the layout. */
@media(max-width:1180px){
  .v27-slots.count-many{grid-template-columns:repeat(3,var(--spread-card-width))}
}
@media(max-width:820px){
  .v27-slots.count-3,
  .v27-slots.count-5,

}

  .v27-slots,
  .v27-slots.count-1,
  .v27-slots.count-2,
  .v27-slots.count-3,
  .v27-slots.count-4,
  .v27-slots.count-5,
  .v27-slots.count-6,

/* =========================
   V2.17 — one-row 6-card spread + softer shooting stars + host-ready auth
   ========================= */

/* Six-card spreads always stay on one horizontal row at the exact physical card size.
   Narrow screens scroll horizontally instead of wrapping to a second row. */
.v27-slots.count-6{
  grid-template-columns:repeat(6,var(--spread-card-width))!important;
  grid-auto-flow:column;
  justify-content:center;
  overflow-x:auto;
  overflow-y:visible;
  max-width:100%;
  scrollbar-width:thin;
  scrollbar-color:rgba(171,132,77,.45) transparent;
}

@media(max-width:1120px){

}

/* Softer, slightly curved shooting-star paths. The star keeps moving forward,
   but its vertical drift changes gradually so the movement does not feel robotic. */
.shooting-star{
  width:162px;
  height:1.7px;
  filter:blur(.05px);
  transform-origin:100% 50%;
}
.shooting-star::after{
  content:"";
  position:absolute;
  inset:-6px -10px -6px 38%;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,currentColor);
  opacity:.08;
  filter:blur(5px);
}
.shooting-right{
  left:-210px;
  right:auto;
  transform:none;
  animation:v217ShootRight var(--shoot-duration) cubic-bezier(.38,.05,.23,.98) var(--shoot-delay) infinite;
}
.shooting-left{
  right:-210px;
  left:auto;
  transform:none;
  animation:v217ShootLeft var(--shoot-duration) cubic-bezier(.38,.05,.23,.98) var(--shoot-delay) infinite;
}
@keyframes v217ShootRight{
  0%,9%{opacity:0;transform:translate3d(-6vw,24px,0) rotate(-17deg) scaleX(.82)}
  14%{opacity:.82}
  28%{opacity:.88;transform:translate3d(22vw,-8px,0) rotate(-15deg) scaleX(.96)}
  44%{transform:translate3d(45vw,15px,0) rotate(-18deg) scaleX(1)}
  60%{opacity:.76;transform:translate3d(67vw,-11px,0) rotate(-15.5deg) scaleX(.98)}
  77%{opacity:.58;transform:translate3d(89vw,9px,0) rotate(-17.5deg) scaleX(.93)}
  92%,100%{opacity:0;transform:translate3d(calc(100vw + 390px),-5px,0) rotate(-16deg) scaleX(.86)}
}
@keyframes v217ShootLeft{
  0%,9%{opacity:0;transform:translate3d(6vw,22px,0) rotate(197deg) scaleX(.82)}
  14%{opacity:.78}
  28%{opacity:.86;transform:translate3d(-22vw,-9px,0) rotate(195deg) scaleX(.96)}
  44%{transform:translate3d(-45vw,14px,0) rotate(198deg) scaleX(1)}
  60%{opacity:.74;transform:translate3d(-67vw,-12px,0) rotate(195.5deg) scaleX(.98)}
  77%{opacity:.56;transform:translate3d(-89vw,8px,0) rotate(197.5deg) scaleX(.93)}
  92%,100%{opacity:0;transform:translate3d(calc(-100vw - 390px),-6px,0) rotate(196deg) scaleX(.86)}
}

/* =========================
   V2.19 — manual draw mirrors shuffle/draw slots + fast blurred shooting stars
   ========================= */

/* "Tự chọn bài" now uses the same physical card dimensions and placement rules
   as the shuffle/drag board: 3 across, 6 on one row, 10/custom in 5-column rows. */
.practice-grid.manual-slot-layout,
.practice-grid.manual-slot-layout.dense,
.practice-grid.manual-slot-layout.celtic-grid{
  display:grid;
  grid-template-columns:none;
  gap:20px 18px;
  justify-content:center;
  align-items:start;
  width:100%;
  max-width:none;
  margin:0 auto;
  padding:22px 18px 18px;
  overflow:visible;
}
.manual-slot-layout.count-1{grid-template-columns:repeat(1,var(--spread-card-width))}
.manual-slot-layout.count-2{grid-template-columns:repeat(2,var(--spread-card-width))}
.manual-slot-layout.count-3{grid-template-columns:repeat(3,var(--spread-card-width))}
.manual-slot-layout.count-4{grid-template-columns:repeat(2,var(--spread-card-width))}
.manual-slot-layout.count-5{grid-template-columns:repeat(3,var(--spread-card-width))}
.manual-slot-layout.count-6{
  grid-template-columns:repeat(6,var(--spread-card-width));
  grid-auto-flow:column;
  justify-content:center;
  overflow-x:auto;
  overflow-y:visible;
  scrollbar-width:thin;
  scrollbar-color:rgba(171,132,77,.45) transparent;
}
.manual-slot-layout.count-many{grid-template-columns:repeat(5,var(--spread-card-width))}
.manual-slot-layout.count-6::-webkit-scrollbar{height:7px}
.manual-slot-layout.count-6::-webkit-scrollbar-track{background:transparent}
.manual-slot-layout.count-6::-webkit-scrollbar-thumb{background:rgba(171,132,77,.35);border-radius:999px}
.manual-slot-item{
  width:var(--spread-card-width);
  min-width:var(--spread-card-width);
  max-width:var(--spread-card-width);
  align-self:start;
}
.manual-slot-item .practice-card-face,
.manual-slot-item .manual-empty-slot{
  width:var(--spread-card-width)!important;
  height:var(--spread-card-height)!important;
  min-width:var(--spread-card-width)!important;
  min-height:var(--spread-card-height)!important;
  max-width:var(--spread-card-width)!important;
  max-height:var(--spread-card-height)!important;
  aspect-ratio:auto!important;
  box-sizing:border-box;
  flex:none;
}
.manual-slot-item .practice-card-face{padding:6px}
.manual-slot-item .manual-empty-slot{
  position:relative;
  margin:0;
}
.manual-slot-item .manual-empty-slot span{display:none}
.manual-slot-item .practice-card-caption,
.manual-slot-item .card-actions{width:var(--spread-card-width)}

}
@media(max-width:1180px){

/* Fast shooting-star glide: a short bright head followed by a long soft tail.
   The visible pass lasts roughly 1.4–1.9 seconds instead of drifting for many seconds. */
.shooting-star{
  width:238px;
  height:2px;
  border-radius:999px;
  opacity:0;
  transform-origin:100% 50%;
  will-change:transform,opacity;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.015) 18%,currentColor 88%,currentColor 100%)!important;
  filter:drop-shadow(0 0 3px currentColor);
}
.shooting-star::before{
  right:-3px;
  width:7px;
  height:7px;
  box-shadow:0 0 8px currentColor,0 0 18px currentColor;
  filter:none;
}
.shooting-star::after{
  content:"";
  position:absolute;
  left:0;
  right:12px;
  top:-5px;
  height:12px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent 0%,currentColor 70%,currentColor 100%);
  opacity:.18;
  filter:blur(6px);
  transform:scaleY(.68);
  transform-origin:right center;
}
.theme-light .shooting-star{color:#b48955}
.theme-dark .shooting-star{color:#f0d89f}
.shooting-right{
  left:-280px;
  right:auto;
  transform:none;
  animation:v219ShootRight var(--shoot-duration) linear var(--shoot-delay) infinite;
}
.shooting-left{
  right:-280px;
  left:auto;
  transform:none;
  animation:v219ShootLeft var(--shoot-duration) linear var(--shoot-delay) infinite;
}
@keyframes v219ShootRight{
  0%,8%{opacity:0;transform:translate3d(-8vw,10px,0) rotate(-15deg) scaleX(.78)}
  12%{opacity:.95}
  28%{opacity:.94;transform:translate3d(24vw,-5px,0) rotate(-14deg) scaleX(1.04)}
  52%{opacity:.86;transform:translate3d(63vw,3px,0) rotate(-15deg) scaleX(1)}
  73%{opacity:.50;transform:translate3d(96vw,-4px,0) rotate(-14.5deg) scaleX(.94)}
  80%,100%{opacity:0;transform:translate3d(calc(100vw + 480px),0,0) rotate(-15deg) scaleX(.86)}
}
@keyframes v219ShootLeft{
  0%,8%{opacity:0;transform:translate3d(8vw,10px,0) rotate(195deg) scaleX(.78)}
  12%{opacity:.95}
  28%{opacity:.94;transform:translate3d(-24vw,-5px,0) rotate(194deg) scaleX(1.04)}
  52%{opacity:.86;transform:translate3d(-63vw,3px,0) rotate(195deg) scaleX(1)}
  73%{opacity:.50;transform:translate3d(-96vw,-4px,0) rotate(194.5deg) scaleX(.94)}
  80%,100%{opacity:0;transform:translate3d(calc(-100vw - 480px),0,0) rotate(195deg) scaleX(.86)}
}

/* =========================
   Tarot-1.9 Performance — frontend-only performance pass
   ========================= */
/* Do not force 150 star elements onto their own compositor layers all the time.
   While the physical deck is moving/being handled, keep the star field visible
   but temporarily freeze its animations so the GPU can focus on the cards. */
.star-field .star-item{

/* =========================
   Tarot-2.4 Performance 60FPS — compositor-first fan + lighter idle animation
   Frontend only: no shuffle/draw/orientation/Reader logic changes.
   ========================= */

/* The fan button is now only a stationary hit-box. The visible card lives in a
   pointer-events:none child, so hover can lift the artwork without moving the
   mouse target or creating a second full card clone for every one of 78 cards. */
.v27-fan{
  contain:layout paint style;
  isolation:isolate;
}
.v27-fan .fan-card{
  background:transparent!important;
  background-image:none!important;
  border:0!important;
  box-shadow:none!important;
  color:inherit!important;
  filter:none!important;
  overflow:visible;
  contain:layout style;
  transition:opacity .14s ease!important;
}
.v27-fan .fan-card::before,
.v27-fan .fan-card::after{
  content:none!important;
  display:none!important;
}
.v27-fan .fan-card-visual{
  position:absolute!important;
  inset:0!important;
  z-index:1;
  display:flex!important;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(231,211,163,.54);
  border-radius:5px;
  /* Dense fans do not need 78 expensive outer shadows. Keep the inset frame;
     the single .fan-shadow supplies the shared depth underneath the deck. */
  box-shadow:inset 0 0 0 4px #151a13,inset 0 0 0 5px rgba(213,179,109,.16);
  transform:translate3d(0,0,0);
  transform-origin:50% 112%;
  transition:transform .16s cubic-bezier(.22,.72,.18,1),filter .12s ease,box-shadow .12s ease;
  pointer-events:none;
  will-change:auto;
}
.v27-fan .fan-card-visual::before{
  content:"";
  position:absolute;
  inset:9px;
  border:1px solid rgba(213,179,109,.26);
  background:
    radial-gradient(circle at center,transparent 0 10px,rgba(213,179,109,.06) 11px 12px,transparent 13px),
    linear-gradient(45deg,transparent 48%,rgba(213,179,109,.11) 49% 51%,transparent 52%),
    linear-gradient(-45deg,transparent 48%,rgba(213,179,109,.11) 49% 51%,transparent 52%);
  pointer-events:none;
}
.v27-fan .fan-card-visual>i{
  position:relative;
  z-index:2;
  color:#dfc47f;
  font-style:normal;
  font-size:20px;
  line-height:1;
  text-shadow:0 0 10px rgba(213,179,109,.32);
}
.v27-fan .fan-card:hover:not(:disabled){
  bottom:var(--fan-bottom)!important;
  filter:none!important;
  box-shadow:none!important;

  border-color:transparent!important;
  color:inherit!important;
}
.v27-fan .fan-card:hover:not(:disabled) .fan-card-visual{
  transform:translate3d(0,-13px,0);

  box-shadow:0 11px 22px rgba(0,0,0,.34),inset 0 0 0 4px #151a13,inset 0 0 0 5px rgba(213,179,109,.16),0 0 0 1px rgba(240,216,159,.20);

}
.v27-fan .fan-card.source-dragging .fan-card-visual{
  opacity:.18;
  filter:brightness(.72);
}
.v27-fan .fan-card.picked .fan-card-visual{
  visibility:hidden;
}

/* Light-theme equivalent of the single visible child. */
.theme-light .v27-fan .fan-card-visual{

}
.theme-light .v27-fan .fan-card-visual>i{color:#8b6333;text-shadow:0 0 8px rgba(181,128,59,.16)}

/* Replace two animations per star (travel + brightness filter) with one
   compositor-friendly transform/opacity animation on roughly one third of the
   75 visible stars. The remaining stars stay visible and static. */
.star-field .star-item{

  transform:translate3d(0,0,0);

.star-field .star-item:nth-child(3n+1){

    will-change:transform,opacity!important;

.v27-deck-stage{contain:layout style paint}
.performance-drag-ghost{contain:layout style paint}

}

/* =========================
   Tarot-2.7 Low GPU — idle/background resource release
   Frontend-only: shuffle/draw/orientation/Reader data are unchanged.
   ========================= */

/* Static stars keep the same 75-star composition without forcing the GPU to
   composite new frames forever while the user is reading or using another app. */
.star-field .star-item,
.star-field .star-item:nth-child(3n+1),
.star-field .star-item:nth-child(4n+1){
  animation:none!important;
  transform:none!important;
  will-change:auto!important;
}

/* Do not promote every card in the 78-card fan to a GPU layer. The fan geometry
   is static; only the one card under the pointer moves. */
.v27-fan .fan-card-visual{
  transform:none!important;
  will-change:auto!important;
  transition:transform .15s cubic-bezier(.22,.72,.18,1),box-shadow .12s ease!important;
  filter:none!important;
}
.v27-fan .fan-card:hover:not(:disabled) .fan-card-visual{

   its stage is unmounted rather than leaving 78 transformed elements behind. */
.low-gpu-deck-stage{

/* =========================================================

.question-card textarea::placeholder{

/* Desktop: one stationary pointer layer owns the entire fan. This removes the

.fan-pointer-layer{display:none}

@media (hover:hover) and (pointer:fine){

  .v27-fan .fan-card.fan-card-targeted:not(:disabled){

/* =========================================================
   Tarot-2.7.5 — contained hover + visible edge selection guide
   ========================================================= */
@media (hover:hover) and (pointer:fine){
  /* Do not pull the selected card above the whole fan. Keeping the parent's
     original z-index preserves the woven fan structure and prevents a card
     from visually popping completely out of the deck. */
  .v27-fan .fan-card.fan-card-targeted:not(:disabled){
    z-index:var(--fan-stack, auto)!important;
  }

  /* A small lift is enough to show hover while the card remains woven under
     the neighbouring cards. */
  .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual{
    transform:translate3d(0,-9px,0)!important;
    filter:brightness(1.08)!important;
    box-shadow:
      0 9px 18px rgba(0,0,0,.30),
      inset 0 0 0 4px #151a13,
      inset 0 0 0 5px rgba(213,179,109,.20)!important;
  }

  /* The guide is the "invisible card": it never blocks the pointer and only
     draws the outline of the currently selectable card. Because it lives above
     the fan, even a heavily covered card at the far left/right is obvious. */
  .fan-selection-guide{
    position:absolute;
    width:3cm;
    height:4.6667cm;
    z-index:1180;
    display:block;
    border:2px solid rgba(248,224,164,.92);
    border-radius:7px;
    background:rgba(213,179,109,.018);
    box-shadow:
      0 0 0 1px rgba(248,224,164,.18),
      0 0 18px rgba(213,179,109,.16),
      inset 0 0 0 1px rgba(248,224,164,.08);
    opacity:0;
    pointer-events:none;
    transform-origin:50% 112%;
    transition:opacity .08s linear, border-color .08s linear, box-shadow .08s linear;
  }
  .fan-selection-guide.is-visible{opacity:1}
  .fan-selection-guide.is-edge-target{
    border-color:rgba(255,232,169,1);
    box-shadow:
      0 0 0 1px rgba(255,232,169,.26),
      0 0 22px rgba(213,179,109,.24),
      inset 0 0 0 1px rgba(255,232,169,.12);
  }

  /* The guide itself provides the outline; suppress the old per-card outline
     pseudo-element so there is no doubled border or extra paint work. */
  .v27-fan .fan-card-visual::after,
  .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual::after{
    content:none!important;
    display:none!important;
  }

  .theme-light .fan-selection-guide{

      0 8px 16px rgba(85,62,88,.12),
      inset 0 0 0 4px rgba(255,255,255,.80),
      inset 0 0 0 5px rgba(157,112,56,.24)!important;
  }
}

/* Touch keeps the original per-card interaction and does not need the desktop
   pointer guide. */
@media (hover:none), (pointer:coarse){
  .fan-selection-guide{display:none!important}
}

/* =========================================================
   Tarot-2.7.6 — edge-only invisible guide + clean contained hover
   ========================================================= */
@media (hover:hover) and (pointer:fine){
  /* The middle of the fan uses only the real card. This removes the doubled
     rectangle/ghost-card artifact that appeared in 2.7.5. */
  .v27-fan .fan-card.fan-card-targeted:not(.fan-card-edge-targeted):not(:disabled){

      inset 0 0 0 5px rgba(213,179,109,.20),
      0 0 0 1px rgba(248,224,164,.52)!important;
  }

  /* Edge cards remain physically woven into the deck. Their separate outline
     is the requested "invisible card" and is the only thing drawn above the fan. */
  .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled){
    z-index:var(--fan-stack)!important;
  }
  .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled) .fan-card-visual{
    transform:none!important;
    box-shadow:
      inset 0 0 0 4px #151a13,
      inset 0 0 0 5px rgba(213,179,109,.16)!important;
  }

  .fan-selection-guide{
    width:3cm;
    height:4.6667cm;
    opacity:0;
    background:transparent!important;
    border:2px solid rgba(255,230,165,.96)!important;
    border-radius:7px;
    box-shadow:
      0 0 0 1px rgba(255,230,165,.24),
      0 0 20px rgba(213,179,109,.22),
      inset 0 0 0 1px rgba(255,230,165,.08)!important;
  }
  .fan-selection-guide.is-visible.is-edge-target{opacity:1!important}
  .fan-selection-guide.edge-left{
    border-left-width:3px!important;
    box-shadow:
      -5px 0 16px rgba(213,179,109,.20),
      0 0 0 1px rgba(255,230,165,.22)!important;
  }
  .fan-selection-guide.edge-right{
    border-right-width:3px!important;
    box-shadow:
      5px 0 16px rgba(213,179,109,.20),
      0 0 0 1px rgba(255,230,165,.22)!important;
  }

  .theme-light .v27-fan .fan-card.fan-card-targeted:not(.fan-card-edge-targeted):not(:disabled) .fan-card-visual{
    box-shadow:
      0 7px 14px rgba(85,62,88,.12),
      inset 0 0 0 4px rgba(255,255,255,.80),
      inset 0 0 0 5px rgba(157,112,56,.24),
      0 0 0 1px rgba(139,96,48,.48)!important;
  }
  .theme-light .fan-selection-guide{
    border-color:rgba(139,96,48,.90)!important;
    box-shadow:0 0 0 1px rgba(139,96,48,.16),0 0 16px rgba(139,96,48,.10)!important;
  }
}

/* =========================================================
   Tarot-2.7.7 — five left ghost cards + lift-only hover
   ========================================================= */
@media (hover:hover) and (pointer:fine){
  /* Never change stacking order on hover. The selected card remains woven into
     the fan and ONLY moves upward. This prevents the full-card pop-out effect. */
  .v27-fan .fan-card.fan-card-targeted:not(:disabled),
  .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled){
    z-index:var(--fan-stack)!important;
  }

  .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual,
  .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled) .fan-card-visual{
    transform:translate3d(0,-24px,0)!important;
    filter:brightness(1.045)!important;
    box-shadow:
      0 10px 18px rgba(0,0,0,.24),
      inset 0 0 0 4px #151a13,
      inset 0 0 0 5px rgba(213,179,109,.16)!important;
  }

  /* The invisible-card outline is rendered only for the first five left cards.
     It follows the exact fan angle and full card dimensions, matching the user's
     sketched guide while keeping the card back itself completely transparent. */
  .fan-selection-guide{
    width:3cm!important;
    height:4.6667cm!important;
    z-index:1190!important;
    opacity:0!important;
    background:transparent!important;
    border:0!important;
    border-radius:7px!important;
    box-shadow:none!important;
    pointer-events:none!important;
    transform-origin:50% 112%!important;
  }
  .fan-selection-guide.is-visible.is-edge-target.edge-left{
    opacity:1!important;
    border:2px solid rgba(255,231,166,.98)!important;
    border-left-width:3px!important;
    box-shadow:
      0 0 0 1px rgba(255,231,166,.22),
      -4px 1px 18px rgba(213,179,109,.22),
      inset 0 0 0 1px rgba(255,231,166,.08)!important;
  }

  /* No right-side invisible card under any circumstance. */
  .fan-selection-guide.edge-right{display:none!important}

  /* Suppress any older pseudo-outline so only the requested left ghost frame
     appears. */
  .v27-fan .fan-card-visual::after,
  .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual::after{
    content:none!important;
    display:none!important;
  }

  .theme-light .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual,
  .theme-light .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled) .fan-card-visual{
    filter:none!important;
    box-shadow:
      0 9px 16px rgba(85,62,88,.11),
      inset 0 0 0 4px rgba(255,255,255,.80),
      inset 0 0 0 5px rgba(157,112,56,.20)!important;
  }
  .theme-light .fan-selection-guide.is-visible.is-edge-target.edge-left{
    border-color:rgba(139,96,48,.92)!important;
    box-shadow:
      0 0 0 1px rgba(139,96,48,.15),
      -4px 1px 16px rgba(139,96,48,.11)!important;
  }
}

/* Tarot-2.7.8 — retain the 36px lift; clipping is restored in 2.7.9. */
@media (hover:hover) and (pointer:fine){
  /* Match the specificity of the older 2.7.6 middle-card rule. Move only the
     artwork; keep the stationary pointer layer, scale and stacking unchanged. */
  .v27-fan .fan-card.fan-card-targeted:not(.fan-card-edge-targeted):not(:disabled) .fan-card-visual,
  .v27-fan .fan-card.fan-card-edge-targeted:not(:disabled) .fan-card-visual{
    transform:translate3d(0,-36px,0)!important;
  }
}

/* Tarot-2.7.9 — exact stationary hit areas and a portal-based left ghost. */
@media (hover:hover) and (pointer:fine){
  .fan-selection-guide.fan-ghost-portal{
    position:fixed;
    bottom:auto;
    width:var(--ghost-width)!important;
    height:var(--ghost-height)!important;
    margin:0;
    transition:none;
  }
  html[data-theme="light"] .fan-selection-guide.fan-ghost-portal.is-visible.is-edge-target.edge-left{
    border-color:rgba(139,96,48,.92)!important;
    box-shadow:0 0 0 1px rgba(139,96,48,.15),-4px 1px 16px rgba(139,96,48,.11)!important;
  }
  .fan-pointer-layer{
    pointer-events:none;
    overflow:hidden;
  }
  .fan-pointer-card{
    position:absolute;
    width:3cm;
    height:4.6667cm;
    border-radius:5px;
    transform-origin:50% 112%;
    pointer-events:auto;
    touch-action:none;
    cursor:grab;
  }
  .fan-pointer-card:active{cursor:grabbing}
}

/* Tarot-2.7.10 — reading-style choices below the question field. */
.reading-style-picker{
  display:flex;
  align-items:center;
  gap:10px;
  padding-top:12px;
}
.reading-style-picker button{
  position:relative;
  min-width:142px;
  border:1px solid rgba(213,179,109,.22);
  border-radius:3px;
  background:rgba(255,255,255,.018);
  color:#9c929f;
  padding:10px 16px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.045em;
  transition:border-color .16s ease,color .16s ease,background .16s ease;
}
.reading-style-picker button:hover,
.reading-style-picker button:focus-visible{
  border-color:rgba(213,179,109,.66);
  color:var(--gold2);
  outline:0;
}
.reading-style-picker button.active{
  border-color:var(--gold);
  background:rgba(213,179,109,.08);
  color:var(--gold2);
}
.reading-style-tooltip{
  position:absolute;
  left:50%;
  bottom:calc(100% + 9px);
  z-index:20;
  width:max-content;
  max-width:220px;
  padding:8px 10px;
  border:1px solid rgba(213,179,109,.34);
  background:#17121c;
  color:#e9d9b6;
  box-shadow:0 8px 22px rgba(0,0,0,.34);
  font-size:11px;
  font-weight:500;
  line-height:1.35;
  letter-spacing:.025em;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,5px);
  transition:opacity .14s ease,transform .14s ease;
}
.reading-style-picker button:hover .reading-style-tooltip,
.reading-style-picker button:focus-visible .reading-style-tooltip{
  opacity:1;
  transform:translate(-50%,0);
}
.theme-light .reading-style-picker button{
  border-color:rgba(105,75,45,.22);
  background:rgba(255,255,255,.28);
  color:#756a73;
}
.theme-light .reading-style-picker button:hover,
.theme-light .reading-style-picker button:focus-visible,
.theme-light .reading-style-picker button.active{
  border-color:rgba(139,96,48,.68);
  background:rgba(166,122,64,.08);
  color:#765328;
}
.theme-light .reading-style-tooltip{
  border-color:rgba(139,96,48,.28);
  background:#fffaf3;
  color:#5c4635;
  box-shadow:0 8px 20px rgba(85,62,88,.14);
}
@media(max-width:620px){
  .reading-style-picker{
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .reading-style-picker::-webkit-scrollbar{display:none}
  .reading-style-picker button{
    min-width:118px;
    padding:9px 11px;
    font-size:12px;
  }
}

.preview-shell{max-width:1200px;margin:16px auto;padding:16px}.preview-controls{display:flex;gap:10px;justify-content:center;margin:16px}.preview-controls button{border:1px solid #a58149;background:#1b171e;color:#deb979;padding:9px 15px;cursor:pointer}.theme-light .preview-controls button{background:#fff9f0;color:#765328}.preview-controls button.active{background:#b28c48;color:#16131b}.preview-shell .interactive-draw{position:relative}.preview-shell .v27-table{position:relative}.preview-shell .picked-slots{z-index:3}


/* Tarot 2.7.32: the login and sign-up screen starts in dark mode. The Tarot
   page keeps its own saved Light/Dark choice, and Supabase behavior is intact. */
.auth-shell{
  color:#f0e8ed;
  background:
    radial-gradient(circle at 17% 18%,rgba(102,71,116,.13),transparent 32%),
    radial-gradient(circle at 82% 23%,rgba(161,121,72,.09),transparent 29%),
    linear-gradient(145deg,#0c0b0f 0%,#15121a 55%,#0d0c10 100%);
}
.auth-shell::before{background:rgba(114,80,133,.10)}
.auth-shell::after{background:rgba(195,147,81,.07)}
.auth-card{
  border-color:rgba(220,188,139,.20);
  background:rgba(27,23,32,.94);
  box-shadow:0 24px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.035);
}
.auth-symbol{border-color:rgba(218,181,113,.30);background:#25202a;color:#dbaf72;box-shadow:none}
.auth-eyebrow{color:#d9b47c}
.auth-card h1{color:#f5edf1}
.auth-card>p{color:#b8aeba}
.auth-tabs{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.09)}
.auth-tabs button{color:#b2a8b7}
.auth-tabs button.active{background:#39303c;color:#fff4e5;box-shadow:none}
.auth-form label>span{color:#cfbfce}
.auth-form input{border-color:rgba(228,208,224,.19);background:#191720;color:#f5ecf2}
.auth-form input:focus{background:#211d29;border-color:#bb9463}
.auth-form input::placeholder{color:#8e8593}
.auth-error{background:#36222a;border-color:rgba(223,124,139,.32);color:#f2b5c0}
.auth-notice{background:#233025;border-color:rgba(147,190,135,.32);color:#d3ecc9}
.auth-setup-code code{background:#201c27;color:#ded1df;border-color:rgba(255,255,255,.12)}
.auth-setup-card small{color:#a99eac}
.auth-loading-screen{color:#d2c4d1}
.auth-orb{color:#dbaf72}

/* Both card-back images have a narrow gold frame baked into their outer 3%.
   Crop only that rim; keep the central artwork and the original card size. */
.theme-dark .ethereal-card-back,
.theme-light .ethereal-card-back,
html[data-theme="dark"] .drag-card-ghost.ethereal-card-back,
html[data-theme="light"] .drag-card-ghost.ethereal-card-back,
html[data-theme="dark"] .card-flight.ethereal-card-back,
html[data-theme="light"] .card-flight.ethereal-card-back{
  background-size:100% 100%!important;
}
.v27-fan .fan-card-visual.ethereal-card-back,
.theme-dark .v27-fan .fan-card-visual.ethereal-card-back,
.theme-light .v27-fan .fan-card-visual.ethereal-card-back,
.v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual.ethereal-card-back,
.theme-light .v27-fan .fan-card.fan-card-targeted:not(:disabled) .fan-card-visual.ethereal-card-back{
  box-shadow:none!important;
}


/* One slim gold outline at the outer edge of every card back. The decorative
   frames inside the artwork remain cropped out. */
.theme-dark .ethereal-card-back,
html[data-theme="dark"] .drag-card-ghost.ethereal-card-back,
html[data-theme="dark"] .card-flight.ethereal-card-back,

 Make the isolated card during shuffle slightly larger while keeping its

</style></head><body class="theme-dark"><div class="preview-shell"><div class="preview-controls"><button type="button" data-theme="dark" class="active">Dark</button><button type="button" data-theme="light">Light</button><button type="button" data-shuffle>Xáo lại</button></div><div class="preview-card-sample" aria-label="Mặt sau lá bài khi xáo"><div class="riffle-card ethereal-card-back" aria-hidden="true"></div></div><section class="interactive-draw panel v26-draw v27-draw"><div class="interactive-draw-head v26-head"><div><div class="panel-kicker">04 · TRẢI BÀI</div><h2>0/3 lá đã có</h2><p>Rê chuột, kéo lá lên ô phía trên hoặc chạm để chọn bài.</p></div></div><div class="draw-table v25-table v26-table v27-table phase-fan"><div class="picked-slots draggable-slots v26-slots v27-slots count-3"><div class="spread-slot-item"><div class="slot-position-heading"><span>01</span><span class="slot-position-name">Quá khứ</span></div><div class="picked-slot drop-slot v26-slot" data-drop-slot="0"></div></div><div class="spread-slot-item"><div class="slot-position-heading"><span>02</span><span class="slot-position-name">Hiện tại</span></div><div class="picked-slot drop-slot v26-slot" data-drop-slot="1"></div></div><div class="spread-slot-item"><div class="slot-position-heading"><span>03</span><span class="slot-position-name">Xu hướng</span></div><div class="picked-slot drop-slot v26-slot" data-drop-slot="2"></div></div></div><div class="v27-deck-stage low-gpu-deck-stage"><div class="fan-zone v25-fan v27-fan" id="preview-fan"><div class="fan-pointer-layer"></div><div class="fan-shadow"></div></div></div></div><div class="deck-bottom-actions v27-deck-actions"><button class="ghost-button" data-reset>Thu bài</button></div></section></div><script>
const fan=document.getElementById('preview-fan'), layer=fan.querySelector('.fan-pointer-layer');
const cardNodes=[],hitNodes=[],selected=new Set(),slots=[...document.querySelectorAll('[data-drop-slot]')];
let dragging=null,ignoreClickUntil=0;
function setTarget(i){cardNodes.forEach(c=>c.classList.remove('fan-card-targeted'));if(!dragging&&!selected.has(i))cardNodes[i].classList.add('fan-card-targeted')}
function clearTarget(){cardNodes.forEach(c=>c.classList.remove('fan-card-targeted'))}
fan.addEventListener('pointerleave',()=>{if(!dragging)clearTarget()});
document.addEventListener('pointermove',event=>{if(!dragging&&!(event.target instanceof Element&&event.target.closest('.fan-pointer-card')))clearTarget()});
window.addEventListener('blur',clearTarget);
function startDrag(event,i){
 if(selected.has(i)||dragging||event.button>0)return;
 event.preventDefault();event.currentTarget.setPointerCapture(event.pointerId);
 const ghost=document.createElement('div');ghost.className='drag-card-ghost ethereal-card-back performance-drag-ghost';
 ghost.style.setProperty('--drag-x',event.clientX+'px');ghost.style.setProperty('--drag-y',event.clientY+'px');
 ghost.innerHTML='<span>✦</span>';document.body.appendChild(ghost);
 cardNodes[i].classList.add('source-dragging');
 dragging={i,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,ghost};
}
function moveDrag(event){
 if(!dragging||event.pointerId!==dragging.pointerId)return;
 event.preventDefault();dragging.ghost.style.setProperty('--drag-x',event.clientX+'px');dragging.ghost.style.setProperty('--drag-y',event.clientY+'px');
 const slot=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop-slot]');
 slots.forEach(s=>s.classList.toggle('drop-hover',s===slot&&!s.classList.contains('filled')));
}
function finishDrag(event,cancel=false){
 if(!dragging||event.pointerId!==dragging.pointerId)return;
 event.preventDefault();const {i,startX,startY,ghost}=dragging;
 const moved=Math.hypot(event.clientX-startX,event.clientY-startY)>7;
 const slot=cancel?null:document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop-slot]');
 ghost.remove();cardNodes[i].classList.remove('source-dragging');slots.forEach(s=>s.classList.remove('drop-hover'));
 if(event.currentTarget.hasPointerCapture(event.pointerId))event.currentTarget.releasePointerCapture(event.pointerId);
 dragging=null;ignoreClickUntil=performance.now()+350;
 if(!cancel){if(slot)pick(i,slot);else if(!moved)pick(i)}
}
for(let i=0;i<78;i++){
 const n=i/77*2-1,b=8+(1-n*n)*68,l=50+n*45,r=n*33;
 const btn=document.createElement('button');btn.type='button';btn.className='fan-card';btn.setAttribute('aria-label','Lá bài '+(i+1));
 btn.style.cssText=`--fan-bottom:${b}px;left:${l}%;bottom:${b}px;transform:translateX(-50%) rotate(${r}deg);z-index:${i+1};--fan-stack:${i+1}`;
 btn.innerHTML='<span class="fan-card-visual ethereal-card-back" aria-hidden="true"><i>✦</i></span>';fan.insertBefore(btn,layer);cardNodes.push(btn);
 const hit=document.createElement('div');hit.className='fan-pointer-card';hit.style.cssText=`--fan-bottom:${b}px;left:${l}%;bottom:${b}px;transform:translateX(-50%) rotate(${r}deg);z-index:${i+1}`;
 for(const node of [btn,hit]){
  node.addEventListener('pointerdown',event=>startDrag(event,i));
  node.addEventListener('pointermove',moveDrag);
  node.addEventListener('pointerup',finishDrag);
  node.addEventListener('pointercancel',event=>finishDrag(event,true));
  node.addEventListener('click',()=>{if(performance.now()>=ignoreClickUntil)pick(i)});
 }
 hit.addEventListener('pointerenter',()=>setTarget(i));layer.appendChild(hit);hitNodes.push(hit);
}
function pick(i,target){if(selected.has(i))return;const s=target||slots.find(x=>!x.classList.contains('filled'));if(!s||s.classList.contains('filled'))return;
 selected.add(i);cardNodes[i].classList.add('picked');cardNodes[i].disabled=true;hitNodes[i].style.display='none';s.classList.add('filled');
 const back=document.createElement('div');back.className='slot-flip-card';back.innerHTML='<span class="slot-flip-inner"><span class="slot-flip-face slot-flip-back ethereal-card-back"><i>✦</i></span></span>';s.appendChild(back);
 document.querySelector('.interactive-draw-head h2').textContent=selected.size+'/3 lá đã có';}
function reset(){if(dragging){dragging.ghost.remove();dragging=null}selected.clear();cardNodes.forEach(x=>{x.disabled=false;x.classList.remove('picked','fan-card-targeted','source-dragging')});hitNodes.forEach(x=>x.style.display='');slots.forEach(x=>{x.classList.remove('filled','drop-hover');x.replaceChildren()});document.querySelector('.interactive-draw-head h2').textContent='0/3 lá đã có';}
document.querySelector('[data-reset]').onclick=reset;document.querySelector('[data-shuffle]').onclick=reset;
document.querySelectorAll('.preview-controls [data-theme]').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.theme;document.documentElement.dataset.theme=t;document.body.className='theme-'+t;document.querySelectorAll('.preview-controls [data-theme]').forEach(b=>b.classList.toggle('active',b===btn))});
</script></body></html>
